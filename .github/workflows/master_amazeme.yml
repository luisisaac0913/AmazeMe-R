# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core + React app to Azure Web App - amazeme

on:
  push:
    branches:
      - 'master'
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      # 1. Configurar Node.js para compilar React 19 con Vite
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 2. Instalar dependencias del cliente frontend
      - name: Install client dependencies
        run: |
          cd amazemec.client
          npm install

      # 3. Configurar .NET Core 10
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # 4. Compilar la solución
      - name: Build with dotnet
        run: dotnet build AmazeMec.Server/AmazeMec.Server.csproj --configuration Release

      # 5. Ejecutar suite de pruebas unitarias xUnit
      - name: Run xUnit tests
        run: dotnet test AmazeMec.Tests/AmazeMec.Tests.csproj --configuration Release --no-build

      # 6. Publicar la API y empaquetar el cliente Vite
      - name: dotnet publish
        run: dotnet publish AmazeMec.Server/AmazeMec.Server.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      # 7. Subir artefacto para el trabajo de despliegue
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9ED9E0B50155486E93E16A573FCA77AC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A365E7A1C880404D84BA94CA93AA941C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_43470AC10DC340F39141058DD8B9EF97 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'amazeme'
          slot-name: 'Production'
          package: .

